<!doctype html><html><head><title>Orders</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head><body><div class="layout"><aside class="sidebar"><div class="logo">ECOM<span>PRO</span></div><div class="nav-title">Overview</div><nav class="nav"><a href="/"><span class="icon">▦</span><span>Dashboard</span></a><a class="active" href="/orders"><span class="icon">◫</span><span>Orders</span></a><a href="/products"><span class="icon">▣</span><span>Products</span></a></nav><div class="nav-title">Management</div><nav class="nav"><a href="/settings"><span class="icon">⚙</span><span>Settings</span></a></nav></aside><main class="main"><header class="topbar"><div class="title"><h1>Orders</h1><p>Track and manage every customer order.</p></div></header><div class="card table-card"><div class="section-head"><h3>All Recent Orders</h3><button class="btn">Export CSV</button></div><table class="table"><thead><tr><th>Order ID</th><th>Customer</th><th>Product</th><th>Amount</th><th>Date</th><th>Status</th></tr></thead><tbody>{% for o in orders %}<tr><td><strong>{{o.id}}</strong></td><td>{{o.customer}}</td><td>{{o.product}}</td><td>${{"%.2f"|format(o.amount)}}</td><td>{{o.date}}</td><td><span class="pill {{o.status|lower|replace(' ','')}}">{{o.status}}</span></td></tr>{% endfor %}</tbody></table></div></main></div></body></html>
